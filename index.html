<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Face Social</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f1a;color:#f5f7ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .card{max-width:420px}
  h1{font-size:28px;margin:0 0 8px;letter-spacing:.04em}
  p{opacity:.85;line-height:1.5;margin:8px 0}
  .ring{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;border:4px solid rgba(255,215,0,.25);border-top-color:#ffd700;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #status{font-size:14px;opacity:.7}
  a{color:#ffd700}
</style>
</head>
<body>
<div class="card">
  <div class="ring" aria-hidden="true"></div>
  <h1>BIG FACE SOCIAL</h1>
  <p>Taking you to Big Face Social…</p>
  <p id="status">Connecting…</p>
</div>
<script>
(function(){
  var statusEl = document.getElementById('status');
  var attempts = 0;
  function remainder(){
    var base = '/bigface-door/';
    var path = window.location.pathname || '';
    var rest = '';
    if (path.indexOf(base) === 0) rest = path.slice(base.length);
    else if (path === '/bigface-door') rest = '';
    if (!rest) return '';
    return '/' + rest + window.location.search + window.location.hash;
  }
  function ownerKey(){
    // Owner mode: the boss's private bookmark carries his auto-door key in
    // the URL fragment (#k=...). Fragments are never sent to any server —
    // this page's JS is the only thing that ever reads it, here in the
    // browser — and it is not part of this repo or page source.
    var h = window.location.hash || '';
    if (h.indexOf('#k=') !== 0 || h.length <= 3) return '';
    try { return decodeURIComponent(h.slice(3)); } catch (e) { return h.slice(3); }
  }
  function isValid(t){
    return /^https:\/\/[A-Za-z0-9.-]+(?::\d+)?(?:\/\S*)?$/.test(t) && t.indexOf(' ') === -1 && t.length < 300;
  }
  function fetchOrigins(){
    // Dual-hot list: the GitHub API serves the repo's origins.json with
    // no CDN lag, so the door follows tunnel rotations within seconds.
    // Fallbacks, in order: the Pages copy of origins.json (can lag
    // minutes on CDN), then target.txt (API, then Pages) as a
    // single-origin list — preserving the old behavior exactly when
    // origins.json is absent.
    function apiFile(path){
      return fetch('https://api.github.com/repos/Dynamic89H/bigface-door/contents/' + path, {cache: 'no-store', headers: {'Accept': 'application/vnd.github.raw'}})
        .then(function(r){ if(!r.ok) throw new Error('api bad status'); return r.text(); });
    }
    function pagesFile(path){
      return fetch(path + '?v=' + Date.now(), {cache: 'no-store'})
        .then(function(r){ if(!r.ok) throw new Error('bad status'); return r.text(); });
    }
    function parseOrigins(txt){
      try {
        var j = JSON.parse((txt || '').trim());
        if (j && j.origins && j.origins.length) return j.origins.filter(isValid);
      } catch (e) {}
      return [];
    }
    function single(txt){
      var one = (txt || '').trim();
      return isValid(one) ? [one] : [];
    }
    return apiFile('origins.json').then(parseOrigins).then(function(list){
      if (list.length) return list;
      return pagesFile('origins.json').then(parseOrigins);
    }).then(function(list){
      if (list.length) return list;
      return apiFile('target.txt').then(single);
    }).then(function(list){
      if (list.length) return list;
      return pagesFile('target.txt').then(single);
    });
  }
  function probeOrigin(origin){
    // True liveness check that needs no CORS and no app change: load
    // the app's small favicon as an image. A live tunnel serves real
    // .ico bytes (onload); a dead tunnel answers an HTML error page or
    // fails outright (onerror). The 4s timeout doubles as a speed gate:
    // a crawling tunnel (~1.8 KB/s needs ~5s for the 8.7KB icon) is
    // skipped in favor of a faster standby.
    return new Promise(function(resolve){
      var done = false;
      var img = new Image();
      var timer = setTimeout(function(){
        if (done) return; done = true; img.src = ''; resolve(false);
      }, 4000);
      img.onload = function(){ if (done) return; done = true; clearTimeout(timer); resolve(true); };
      img.onerror = function(){ if (done) return; done = true; clearTimeout(timer); resolve(false); };
      img.src = origin.replace(/\/+$/, '') + '/favicon.ico?v=' + Date.now();
    });
  }
  function probeBulk(origin){
    // SOFT bulk gate (sweep 2026-10-28, fix #5): a tunnel can pass the
    // 8.7KB favicon probe yet still crawl on real page downloads, so
    // when MORE THAN ONE origin is alive, race a full ~110KB app-index
    // download (no-cors + arrayBuffer, so the whole body must arrive)
    // and prefer the first origin whose bulk download actually
    // finishes within 20s. It is deliberately SOFT: with a single
    // alive origin the gate never runs (no delay added to the common
    // case), and if no origin passes bulk, the first alive origin
    // still wins — a slow door is better than no door.
    return new Promise(function(resolve){
      var done = false;
      var timer = null;
      try {
        var ctrl = ('AbortController' in window) ? new AbortController() : null;
        timer = setTimeout(function(){
          if (done) return; done = true;
          try { if (ctrl) ctrl.abort(); } catch (e) {}
          resolve(false);
        }, 20000);
        var opts = {cache: 'no-store', mode: 'no-cors'};
        if (ctrl) opts.signal = ctrl.signal;
        fetch(origin.replace(/\/+$/, '') + '/?v=' + Date.now(), opts).then(function(r){
          return r.arrayBuffer();
        }).then(function(){
          if (done) return; done = true; clearTimeout(timer); resolve(true);
        }).catch(function(){
          if (done) return; done = true; clearTimeout(timer); resolve(false);
        });
      } catch (e) {
        if (done) return; done = true; if (timer) clearTimeout(timer); resolve(false);
      }
    });
  }
  function go(){
    attempts++;
    statusEl.textContent = attempts > 1 ? ('Still connecting… (try ' + attempts + ')') : 'Connecting…';
    fetchOrigins()
      .then(function(origins){
        if (!origins.length) throw new Error('no origins');
        // Favicon-probe each origin in order; every origin that truly
        // answers joins the alive list, so a dead primary never
        // strands a visitor while the door-sync + Pages window is
        // still catching up.
        var chain = Promise.resolve([]);
        origins.forEach(function(origin){
          chain = chain.then(function(alive){
            return probeOrigin(origin).then(function(ok){
              if (ok) alive.push(origin);
              return alive;
            });
          });
        });
        return chain.then(function(alive){
          if (!alive.length) throw new Error('no healthy origin');
          if (alive.length === 1) return alive[0];
          // Two or more alive: prefer the first whose bulk download
          // actually finishes (soft bulk gate); if none passes, the
          // first alive origin still wins — slow beats stranded.
          return new Promise(function(resolve){
            var settled = false;
            alive.forEach(function(origin){
              probeBulk(origin).then(function(ok){
                if (ok && !settled) { settled = true; resolve(origin); }
              });
            });
            setTimeout(function(){
              if (!settled) { settled = true; resolve(alive[0]); }
            }, 20000);
          });
        });
      })
      .then(function(target){
        var base = target.replace(/\/+$/, '');
        var key = ownerKey();
        if (key) {
          // Owner entry: hand the key straight to the app's owner-enter
          // endpoint on the CHOSEN healthy address (from origins.json,
          // so this bookmark survives every tunnel rotation). The
          // endpoint 302s to the app's /door page, which completes the
          // sign-in.
          statusEl.textContent = 'Opening your door…';
          window.location.replace(base + '/api/auth/owner-enter?key=' + encodeURIComponent(key));
          return;
        }
        statusEl.textContent = 'Opening Big Face Social…';
        // New visitors land on Look Inside — the public tour of the
        // kingdom that ends at signup. An explicit door path (rare)
        // still goes exactly where it pointed.
        var rest = remainder();
        window.location.replace(base + (rest ? rest : '/inside'));
      })
      .catch(function(){
        // After 3 failed cycles, say something useful instead of
        // looping the same line forever (sweep fix #6): the door keeps
        // retrying on its own, and the saved door link still works.
        statusEl.textContent = attempts >= 3
          ? 'Still can\'t reach Big Face — its address may be switching right now. This page keeps retrying; your saved door link still works.'
          : 'Connection hiccup — retrying in 10 seconds…';
        setTimeout(go, 10000);
      });
  }
  go();
})();
</script>
</body>
</html>
