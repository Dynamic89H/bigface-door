<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Face Social</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f1a;color:#f5f7ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .card{max-width:420px}
  h1{font-size:28px;margin:0 0 8px;letter-spacing:.04em}
  p{opacity:.85;line-height:1.5;margin:8px 0}
  .ring{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;border:4px solid rgba(255,215,0,.25);border-top-color:#ffd700;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #status{font-size:14px;opacity:.7}
  a{color:#ffd700}
</style>
</head>
<body>
<div class="card">
  <div class="ring" aria-hidden="true"></div>
  <h1>BIG FACE SOCIAL</h1>
  <p>Taking you to Big Face Social…</p>
  <p id="status">Connecting…</p>
</div>
<script>
(function(){
  var statusEl = document.getElementById('status');
  var attempts = 0;
  function remainder(){
    var base = '/bigface-door/';
    var path = window.location.pathname || '';
    var rest = '';
    if (path.indexOf(base) === 0) rest = path.slice(base.length);
    else if (path === '/bigface-door') rest = '';
    if (!rest) return '';
    return '/' + rest + window.location.search + window.location.hash;
  }
  function ownerKey(){
    // Owner mode: the boss's private bookmark carries his auto-door key in
    // the URL fragment (#k=...). Fragments are never sent to any server —
    // this page's JS is the only thing that ever reads it, here in the
    // browser — and it is not part of this repo or page source.
    var h = window.location.hash || '';
    if (h.indexOf('#k=') !== 0 || h.length <= 3) return '';
    try { return decodeURIComponent(h.slice(3)); } catch (e) { return h.slice(3); }
  }
  function isValid(t){
    return /^https:\/\/[A-Za-z0-9.-]+(?::\d+)?(?:\/\S*)?$/.test(t) && t.indexOf(' ') === -1 && t.length < 300;
  }
  function fetchTarget(){
    // Primary: the GitHub API serves the repo's target.txt with no CDN
    // lag, so the door follows tunnel rotations within seconds.
    // Fallback: the Pages copy of target.txt (can lag minutes on CDN).
    return fetch('https://api.github.com/repos/Dynamic89H/bigface-door/contents/target.txt', {cache: 'no-store', headers: {'Accept': 'application/vnd.github.raw'}})
      .then(function(r){ if(!r.ok) throw new Error('api bad status'); return r.text(); })
      .then(function(t){ if (!isValid((t || '').trim())) throw new Error('api bad target'); return t; })
      .catch(function(){
        return fetch('target.txt?v=' + Date.now(), {cache: 'no-store'})
          .then(function(r){ if(!r.ok) throw new Error('bad status'); return r.text(); });
      });
  }
  function go(){
    attempts++;
    statusEl.textContent = attempts > 1 ? ('Still connecting… (try ' + attempts + ')') : 'Connecting…';
    fetchTarget()
      .then(function(txt){
        var target = (txt || '').trim();
        if (!isValid(target)) throw new Error('bad target');
        var base = target.replace(/\/+$/, '');
        var key = ownerKey();
        if (key) {
          // Owner entry: hand the key straight to the app's owner-enter
          // endpoint on the CURRENT app address (from target.txt, so this
          // bookmark survives every tunnel rotation). The endpoint 302s
          // to the app's /door page, which completes the sign-in.
          statusEl.textContent = 'Opening your door…';
          window.location.replace(base + '/api/auth/owner-enter?key=' + encodeURIComponent(key));
          return;
        }
        statusEl.textContent = 'Opening Big Face Social…';
        // New visitors land on Look Inside — the public tour of the
        // kingdom that ends at signup. An explicit door path (rare)
        // still goes exactly where it pointed.
        var rest = remainder();
        window.location.replace(base + (rest ? rest : '/inside'));
      })
      .catch(function(){
        statusEl.textContent = 'Connection hiccup — retrying in 10 seconds…';
        setTimeout(go, 10000);
      });
  }
  go();
})();
</script>
</body>
</html>
